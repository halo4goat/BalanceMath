	<script type='text/javascript'>
	
		var Allowed = true;
	
		function NotAllowed() {

			Allowed = false;
			
		}
	
		var currentUrl = document.referrer.split('/')[2];
		
		console.log(currentUrl);
		
		if(currentUrl == 'undefined' || currentUrl == null ){

			NotAllowed();
	
		}
		
		switch(currentUrl) {
		   case 'akidgames.com': 
				NotAllowed();
			   break;
		   case 'www.akidgames.com': 
				NotAllowed();
			   break;
		   case 'millionartist.com':

			   break;
		   case 'www.bestgames.com':

			   break;
		   case 'bestgames.com': 
				NotAllowed();
			   break;
		   case 'gamasexual.com': 
				NotAllowed();
			   break;
		   default: 
			   break;
		}
		
		if(Allowed != true){

			document.getElementById("gameContainer").style.display = 'none';
			document.getElementById("NotAllowed").style.display = 'block';

		}
		
		 window.document.title = "POLYBLICY - Embedded page - " + currentUrl;
	
	</script>
