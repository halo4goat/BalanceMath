name: Build BalanceMath EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/classes | Out-Null
          javac -d build/classes BalanceMath/src/balancemath/BalanceMath.java
          jar --create --file build/BalanceMath.jar --main-class balancemath.BalanceMath -C build/classes .
      - name: Build EXE
        shell: pwsh
        run: |
          jpackage --type exe --name BalanceMath --input build --main-jar BalanceMath.jar --main-class balancemath.BalanceMath --dest dist --win-shortcut --win-menu
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: BalanceMath-Windows
          path: dist/*.exe
