name: Build BalanceMath

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4
      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Compile
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/classes | Out-Null
          javac -d build/classes BalanceMath.java
          jar --create --file build/BalanceMath.jar --main-class balancemath.BalanceMath -C build/classes .
      - name: Make the Windows app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          jpackage --type exe --name BalanceMath --input build --main-jar BalanceMath.jar --main-class balancemath.BalanceMath --dest dist --win-shortcut --win-menu
      - name: Save the EXE
        uses: actions/upload-artifact@v4
        with:
          name: BalanceMath-Windows
          path: dist/BalanceMath-*.exe
